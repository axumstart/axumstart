[package]
name = "axumstart"
version = "0.1.4"
edition = "2024"
description = "Batteries-included Axum starter: pick DI components and a SQL backend via Cargo features"
license = "MIT"
repository = "https://github.com/axumstart/axumstart"
include = ["src/**", "/LICENSE"]

[features]
default = ["components", "router"]
components = ["dep:axumstart_components"]
router = ["components", "dep:axumstart_router", "dep:axum", "dep:tokio", "dep:dotenvy"]
postgres = ["dep:axumstart_db", "axumstart_db/postgres"]
mysql = ["dep:axumstart_db", "axumstart_db/mysql"]
sqlite = ["dep:axumstart_db", "axumstart_db/sqlite"]

[workspace]
members = [
    "axumstart_components",
    "axumstart_components/macros",
    "axumstart_db",
    "axumstart_db/macros",
    "axumstart_router",
    "axumstart_router/macros",
    "examples/quickstart",
]

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
tokio = "1"
parking_lot = "0.12"
inventory = "0.3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

[dependencies]
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
dotenvy = { version = "0.15", optional = true }
axumstart_components = { path = "axumstart_components", version = "0.1.4", optional = true }
axumstart_db = { path = "axumstart_db", version = "0.1.4", optional = true }
axumstart_router = { path = "axumstart_router", version = "0.1.4", optional = true }
