[package]
name = "axumstart"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "axumstart_components",
    "axumstart_components/macros",
    "axumstart_db",
    "axumstart_db/macros",
]

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
tokio = "1"
parking_lot = "0.12"
inventory = "0.3"
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["runtime-tokio"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dependencies]
