[package]
name = "axumstart_db_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[features]
postgres = []
mysql = []
sqlite = []

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
trybuild = { version = "1", features = ["diff"] }
sqlx = { workspace = true, features = ["postgres", "derive"] }
async-trait = "0.1"
axumstart_db = { path = "..", features = ["postgres"] }
